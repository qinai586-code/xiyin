name: Foundation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - name: Foundation unit and integration checks (no models or production data)
        run: python -W error -m unittest discover -s tests -v
      - name: Compile active entry and runtime
        run: python -m compileall -q xiyin.py xiyin_paths.py xiyin_identity.py xiyin_management.py xiyin_runtime L2_CENTRAL/C1_Auth L2_CENTRAL/L2_MAIN L5_SAFE/ADMIN_TOOLS tools tests
      - name: Parse Windows launch scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem tools/*.ps1 | ForEach-Object {
            $Tokens = $null; $Errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$Tokens, [ref]$Errors)
            if ($Errors.Count -gt 0) { throw ($Errors | Out-String) }
          }
