# XIYIN runtime machine/inference configuration (single source for
# inference endpoint + machine state locations). Deployed values may be
# re-registered per machine; the code/data roots are NOT authorized here.
[inference]
endpoint = "http://127.0.0.1:8080/v1/chat/completions"
model = "xiyin"
timeout_seconds = 60
max_tokens = 512
enable_thinking = false

[foundation]
max_input_chars = 2000
# Character budget is a guard, not an exact model-token count.
max_context_chars = 4500
history_messages = 8

[machine]
# Legacy supervisor only; Foundation does not infer health from this directory.
# Machine value is retained and is not used as the new runtime data root.
heartbeat_dir = "C:\\Users\\SJ_Run\\AppData\\Local\\Temp\\qinai_launcher_runtime_state"
