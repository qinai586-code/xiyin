# XIYIN runtime machine/inference configuration (single source for
# inference endpoint + machine state locations). Deployed values may be
# re-registered per machine; the code/data roots are NOT authorized here.
[inference]
endpoint = "http://127.0.0.1:8080/v1/chat/completions"
model = "xiyin"
# Fallback bounds for callers that do not plan a turn. A normal conversation
# turn now receives a per-request budget from response_plan instead.
timeout_seconds = 60
max_tokens = 512
enable_thinking = false
# Ceilings for a planned turn. max_tokens_ceiling is a resource bound, not a
# reply-length target; a detailed answer is allowed to use it.
max_tokens_ceiling = 1792
max_timeout_seconds = 600
# Must match the server's ctx_size so a budget cannot overrun the window.
context_tokens = 4096
# Starting throughput assumption until this machine has been measured.
# Deliberately conservative: a CPU run is slower than a GPU run.
default_tokens_per_second = 8.0

[foundation]
max_input_chars = 2000
# Character budget is a guard, not an exact model-token count.
max_context_chars = 4500
history_messages = 8
# How the character seed is projected for the speaking model. "v2" keeps body
# presentation out of the text rulebook; "v1" is the projection the Windows
# acceptance run tested, kept byte-identical for A/B comparison and rollback.
persona_projection = "v2"

[autonomy]
# Foreground input preempts bounded jobs. No model-driven activity is auto-enabled.
idle_sleep_seconds = 300
